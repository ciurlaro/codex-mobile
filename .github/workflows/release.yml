name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching codexMobile.versionName
        required: true
        default: v0.2.0-preview.3

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-mobile-release
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'ciurlaro/codex-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      run_id: ${{ steps.verify.outputs.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: version
        run: |
          version=$(sed -n 's/^codexMobile.versionName=//p' gradle.properties)
          test -n "$version"
          test "${{ inputs.tag }}" = "v$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - id: verify
        name: Find the successful verification for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')
          test -n "$run_id" || { echo "No successful Verify run exists for $GITHUB_SHA" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-mobile-host-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.run_id }}
      - name: Verify candidate provenance
        run: |
          test "$(cat candidate/source-revision.txt)" = "$GITHUB_SHA"
          test -s candidate/modules/android/app/build/outputs/apk/release/app-release.apk

  sign:
    needs: candidate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "build-tools;36.0.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-mobile-host-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.run_id }}
      - name: Sign with the production identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          input=candidate/modules/android/app/build/outputs/apk/release/app-release.apk
          output=Codex-Mobile-${{ needs.candidate.outputs.version }}.apk
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$tools/zipalign" -f -p 4 "$input" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$output" \
            "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$output"
          actual=$("$tools/apksigner" verify --print-certs "$output" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}')
          expected=$(cat candidate/release-signing-certificate.sha256)
          test "$actual" = "$expected"
          sha256sum "$output" > "$output.sha256"
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-host-release
          if-no-files-found: error
          path: |
            Codex-Mobile-*.apk
            Codex-Mobile-*.apk.sha256
            candidate/docs/sbom.cdx.json
            candidate/LICENSE
            candidate/LICENSES/MLKIT-EXCEPTION.txt
            candidate/THIRD_PARTY_NOTICES.md
            candidate/modules/android/app/build/outputs/mapping/release/mapping.txt

  publish:
    needs: [candidate, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-host-release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(release create "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --title "Codex Mobile ${{ needs.candidate.outputs.version }}")
          if [[ "${{ needs.candidate.outputs.version }}" == *-* ]]; then args+=(--prerelease); fi
          args+=(release/Codex-Mobile-*.apk release/Codex-Mobile-*.apk.sha256 release/candidate/docs/sbom.cdx.json release/candidate/LICENSE release/candidate/LICENSES/MLKIT-EXCEPTION.txt release/candidate/THIRD_PARTY_NOTICES.md release/candidate/modules/android/app/build/outputs/mapping/release/mapping.txt)
          gh "${args[@]}"
