[versions]
agp = "9.2.1"
kotlin = "2.3.10"
coroutines = "1.10.2"
serialization = "1.9.0"
activity = "1.13.0"
lifecycle = "2.11.0"
compose-bom = "2026.06.01"
androidx-test = "1.7.0"
androidx-test-ext = "1.3.0"
androidx-browser = "1.10.0"
markdown = "0.41.0"
ratex = "0.1.13"
androidx-sqlite = "2.7.0"
extension-provider-api = "2.0.0"
codex-agent-runtime = "0.145.0-1"
ktor = "3.5.1"
kmp-process = "0.5.0"
kmp-file = "0.6.0"
kotlincrypto = "0.8.0"
kotlinx-io = "0.9.0"
documents-provider = "1.0.0"
telegram-provider = "1.0.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
markdown-material3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown" }
ratex-android = { module = "io.github.erweixin:ratex-android", version.ref = "ratex" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }
codex-extension-provider-api = { module = "io.github.ciurlaro.codexmobile:extension-provider-api", version.ref = "extension-provider-api" }
kmp-process = { module = "io.matthewnelson.kmp-process:process", version.ref = "kmp-process" }
kmp-file = { module = "io.matthewnelson.kmp-file:file", version.ref = "kmp-file" }
kotlincrypto-sha2 = { module = "org.kotlincrypto.hash:sha2", version.ref = "kotlincrypto" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
documents-provider-android = { module = "io.github.ciurlaro.codexmobile.providers:documents-android", version.ref = "documents-provider" }
telegram-provider-android = { module = "io.github.ciurlaro.codexmobile.providers:telegram-android", version.ref = "telegram-provider" }

[bundles]
android-test = ["androidx-test-ext-junit", "androidx-test-runner"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-dynamic-feature = { id = "com.android.dynamic-feature", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
